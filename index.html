<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INASEP – Visor Seguro</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Source+Serif+4:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --green:#2d6b5e; --green2:#1f4d43; --gold:#c9a84c;
  --bg:#0d0d0d; --surface:#141414; --border:#2a2a2a;
  --text:#e8e2d6; --muted:#6b6b6b;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"Source Serif 4",serif;min-height:100vh;overflow-x:hidden;width:100%;-webkit-user-select:none;user-select:none}
@media print{html,body{display:none!important}}
#blackout{display:none;position:fixed;inset:0;background:#000;z-index:9999}
#topbar{position:sticky;top:0;z-index:100;background:var(--bg)}
header{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;padding:10px 20px;box-shadow:0 4px 24px rgba(0,0,0,.6)}
header img{height:40px;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(45,107,94,.5))}
.header-title{font-family:"Rajdhani",sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:.06em;line-height:1.2;min-width:0}
.header-title span{color:var(--gold);display:block;font-size:.68rem;font-weight:500;letter-spacing:.16em}
.header-badge{margin-left:auto;background:rgba(45,107,94,.18);border:1px solid var(--green);color:var(--green);font-family:"Rajdhani",sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.12em;padding:4px 10px;border-radius:2px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
#toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:10px 20px;background:#111;border-bottom:1px solid var(--border)}
.tb-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:"Rajdhani",sans-serif;font-size:.85rem;font-weight:600;letter-spacing:.08em;padding:6px 16px;border-radius:2px;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
.tb-btn:hover{background:var(--green2);border-color:var(--green)}
.tb-btn:disabled{opacity:.3;cursor:default}
#page-info{font-family:"Rajdhani",sans-serif;font-size:.9rem;color:var(--muted);margin:0 8px;min-width:70px;text-align:center}
#zoom-group{display:flex;gap:8px;margin-left:auto}
main{display:flex;flex-direction:column;align-items:center;width:100%;padding:32px 16px 60px;gap:28px}
.page-wrap{position:relative;box-shadow:0 8px 40px rgba(0,0,0,.7);border:1px solid var(--border);overflow:hidden;background:#fff;border-radius:2px;max-width:100%!important;width:auto!important;height:auto!important}
.page-wrap canvas:not(.watermark-canvas){display:block;width:100%;height:auto}
.watermark-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
@media (max-width:640px){
  header{padding:8px 14px;gap:8px 12px}
  header img{height:32px}
  .header-title{font-size:.9rem}
  .header-title span{font-size:.58rem;letter-spacing:.12em}
  .header-badge{font-size:.6rem;padding:3px 8px}
  #toolbar{padding:8px 12px;justify-content:center}
  #toolbar > div[style*="flex:1"]{display:none}
  #zoom-group{margin-left:0}
  .tb-btn{padding:6px 12px;font-size:.78rem}
  #page-info{min-width:56px;font-size:.8rem}
  main{padding:20px 10px 48px;gap:18px}
}
@media (max-width:380px){
  .tb-btn{padding:5px 9px;font-size:.72rem}
  header-title{font-size:.85rem}
}
#loading{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:200}
#loading img{height:64px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.95)}50%{opacity:1;transform:scale(1)}}
#loading p{font-family:"Rajdhani",sans-serif;font-size:1rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.progress-bar{width:200px;height:2px;background:var(--border);border-radius:1px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);width:0%;transition:width .3s}
#error-msg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300;font-family:"Rajdhani",sans-serif;color:var(--text);text-align:center;padding:20px}
#error-msg h2{color:#e55;font-size:1.4rem;letter-spacing:.1em}
#error-msg pre{background:#1a1a1a;border:1px solid var(--border);padding:12px 20px;border-radius:4px;font-size:.8rem;color:var(--muted);max-width:500px;white-space:pre-wrap;word-break:break-all}
</style>
</head>

});

  const b=document.getElementById("blackout");
  b.style.display="block";
  setTimeout(()=>b.style.display="none",300);
}

function b64ToUint8(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}

async function loadPDF() {
  try {
    const data = b64ToUint8(PDF_B64);
    document.getElementById("pfill").style.width = "30%";

    const task = pdfjsLib.getDocument({ data });
    task.onProgress = p => {
      if(p.total) document.getElementById("pfill").style.width = (30 + p.loaded/p.total*60) + "%";
    };

    pdfDoc = await task.promise;
    document.getElementById("pfill").style.width = "90%";

    await renderAll();

    document.getElementById("pfill").style.width = "100%";
    setTimeout(()=>{ document.getElementById("loading").style.display="none"; }, 300);
    updateUI();

  } catch(err) {
    document.getElementById("loading").style.display="none";
    document.getElementById("error-detail").textContent = err.toString() + "\n\nStack: " + (err.stack||"");
    document.getElementById("error-msg").style.display="flex";
    console.error("PDF load error:", err);
  }
}

async function renderAll() {
  const main = document.getElementById("mc");
  main.innerHTML = "";
  for(let n=1; n<=pdfDoc.numPages; n++) {
    const page = await pdfDoc.getPage(n);
    const vp   = page.getViewport({scale});

    const wrap = document.createElement("div");
    wrap.className = "page-wrap";
    wrap.id = "page-"+n;
    wrap.style.cssText = `width:${vp.width}px;height:${vp.height}px`;

    const cv = document.createElement("canvas");
    cv.width=vp.width; cv.height=vp.height;
    cv.style.display="block";
    await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;

    const wm = document.createElement("canvas");
    wm.className="watermark-canvas";
    wm.width=vp.width; wm.height=vp.height;
    drawWM(wm);

    wrap.appendChild(cv);
    wrap.appendChild(wm);
    main.appendChild(wrap);
    document.getElementById("pfill").style.width = (90 + n/pdfDoc.numPages*10) + "%";
  }

  // observe pages
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting) {
        const n = parseInt(e.target.id.replace("page-",""));
        if(!isNaN(n)) { currentPage=n; updateUI(); }
      }
    });
  }, {threshold:0.4});
  document.querySelectorAll(".page-wrap").forEach(el => obs.observe(el));
}

function drawWM(canvas) {
  const ctx = canvas.getContext("2d");
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);

  // diagonal text
  ctx.save();
  ctx.globalAlpha=0.11;
  ctx.font="bold 14px Rajdhani,sans-serif";
  ctx.fillStyle="#2d6b5e";
  ctx.translate(w/2,h/2);
  ctx.rotate(-Math.PI/5);
  for(let y=-h;y<h;y+=85) for(let x=-w;x<w;x+=220)
    ctx.fillText("INASEP · SOLO LECTURA",x,y);
  ctx.restore();

  // center logo
  function drawLogo() {
    const sw=w*0.3;
    ctx.save(); ctx.globalAlpha=0.06;
    ctx.drawImage(logoImg,w/2-sw/2,h/2-sw/2,sw,sw);
    ctx.restore();
  }
  if(logoImg.complete && logoImg.naturalWidth>0) drawLogo();
  else logoImg.onload=()=>{ drawLogo(); };
}

function updateUI() {
  const n=pdfDoc?pdfDoc.numPages:0;
  document.getElementById("page-info").textContent = currentPage+" / "+n;
  document.getElementById("btn-prev").disabled = currentPage<=1;
  document.getElementById("btn-next").disabled = currentPage>=n;
}

function scrollTo(n) {
  const el=document.getElementById("page-"+n);
  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
  currentPage=n; updateUI();
}

document.getElementById("btn-prev").onclick = ()=>{ if(currentPage>1) scrollTo(--currentPage); };
document.getElementById("btn-next").onclick = ()=>{ if(currentPage<pdfDoc.numPages) scrollTo(++currentPage); };

document.getElementById("btn-zoom-in").onclick  = ()=>changeZoom(0.25);
document.getElementById("btn-zoom-out").onclick = ()=>changeZoom(-0.25);

async function changeZoom(d) {
  const ns=Math.min(3,Math.max(0.5,scale+d));
  if(ns===scale) return;
  scale=ns;
  document.getElementById("loading").style.display="flex";
  document.getElementById("pfill").style.width="0%";
  await renderAll();
  document.getElementById("loading").style.display="none";
  scrollTo(currentPage);
}

loadPDF();
</script>
